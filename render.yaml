services:
  - type: web
    name: nan-game-server
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_DEBUG_COMBAT_COMMANDS
        value: false
      - key: ENABLE_SPIKE_ROOM
        value: false
